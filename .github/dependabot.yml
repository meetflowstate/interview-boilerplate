# One Dependabot version-update PR per week for the whole repo: every
# ecosystem and every update type (major, minor and patch) lands in a single
# grouped PR on Monday morning. The auto-merge workflow merges it unless a
# dependency moves a major version, in which case it's labelled
# needs-human-review. Multi-ecosystem groups cover version updates only: if
# Dependabot security updates are switched on in the repo settings, those
# still arrive as their own PRs.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    labels:
      - "dependencies"
