# One Dependabot PR per week for the whole repo: every ecosystem and every
# update (major, minor and patch) lands in a single grouped PR on Monday
# morning. The auto-merge workflow merges it when CI passes and nothing moves
# a major version; otherwise it's labelled needs-human-review.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    labels:
      - "dependencies"
